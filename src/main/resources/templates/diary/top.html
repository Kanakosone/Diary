<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>日記カレンダー</title>
	<script src='https://cdn.jsdelivr.net/npm/fullcalendar/index.global.min.js'></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/locales-all.min.js'></script>
</head>
<body>
    <h1>日記カレンダー</h1>
    <div id='calendar'></div>

	<script th:inline="javascript">
	  document.addEventListener('DOMContentLoaded', function () {
	    var calendarEl = document.getElementById('calendar');
	    var diaryEvents = /*[[${diaryEvents}]]*/ '[]'; // ←変数に一回入れる！

	    var calendar = new FullCalendar.Calendar(calendarEl, {
	      initialView: 'dayGridMonth',
	      locale: 'ja',
	      events: JSON.parse(diaryEvents) // ←ここでJSONとして渡す！！
	
		  ,eventClick: function(info) {
		          var event = info.event.extendedProps;

		          // 詳細エリアに内容を反映
		          document.getElementById('detail').innerHTML =
		            `<p>保存内容: ${event.withWhom}${event.location}${event.activity}</p>`;
		        }
	  
	      });
	
	    calendar.render();
	  });
	</script>

	<div id="detail"></div> <!-- ここにクリック時に表示される -->
    <a th:href="@{/diary/form}">戻る</a>
</body>
</html>
